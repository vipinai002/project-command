<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Command</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07080d; --surface:#0e1018; --surface2:#151823; --surface3:#1c2030;
  --border:#1e2130; --border2:#252840;
  --accent:#e8c547; --accent-dim:rgba(232,197,71,0.10);
  --text:#c8cde0; --text-bright:#eef0f8; --muted:#4a4f68;
  --green:#3dd68c; --green-dim:rgba(61,214,140,0.08);
  --yellow:#e8c547; --yellow-dim:rgba(232,197,71,0.08);
  --red:#ff5c5c; --red-dim:rgba(255,92,92,0.08);
  --blue:#5b9cf6; --blue-dim:rgba(91,156,246,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,197,71,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(232,197,71,.02) 1px,transparent 1px);background-size:52px 52px;pointer-events:none}
.glow{position:fixed;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(232,197,71,.03) 0%,transparent 70%);top:-300px;right:-200px;pointer-events:none}
.hidden{display:none!important}
.view{position:relative;z-index:1;display:none}
.view.active{display:block}

/* LOCK SCREEN */
.lock-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.lock-screen::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(232,197,71,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(232,197,71,.025) 1px,transparent 1px);background-size:52px 52px;pointer-events:none}
.lock-box{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:48px 52px;text-align:center;width:380px;max-width:95vw}
.lock-icon{font-size:36px;margin-bottom:16px;display:block}
.lock-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.06em;color:var(--text-bright);margin-bottom:4px}
.lock-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:32px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:28px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--red);border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pin-key{background:var(--surface2);border:1px solid var(--border2);color:var(--text-bright);border-radius:4px;padding:16px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.05em;transition:all .1s;user-select:none}
.pin-key:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
.pin-key:active{transform:scale(.94)}
.pin-key.wide{grid-column:span 2;font-size:14px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.lock-error{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--red);margin-top:8px;min-height:18px;letter-spacing:.05em}
.lock-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:16px;line-height:1.6}

/* AUTOLOCK BAR */
.autolock-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:8px 48px;display:flex;align-items:center;justify-content:space-between}
.autolock-text{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.autolock-timer{color:var(--accent)}

/* HEADER */
.header{padding:28px 48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:24px;background:rgba(7,8,13,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:14px;cursor:pointer}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#07080d}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:var(--text-bright)}
.logo-text span{color:var(--accent)}
.live-clock{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#07080d;font-weight:500}
.btn-primary:hover{opacity:.88;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;border:1px dashed var(--border2);color:var(--muted)}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.btn-danger{background:var(--red-dim);border:1px solid rgba(255,92,92,.2);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:9px}

/* API KEY BAR */
.apikey-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 48px;display:flex;align-items:center;gap:12px}
.apikey-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.apikey-input{flex:1;max-width:420px;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;border-radius:2px;outline:none;transition:border-color .2s}
.apikey-input:focus{border-color:var(--accent)}
.apikey-input::placeholder{color:var(--muted)}
.apikey-saved{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green)}

/* DASHBOARD */
#dashboardView{padding:40px 48px 100px}
.dash-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.dash-eyebrow::before{content:'';display:inline-block;width:16px;height:1px;background:var(--accent)}
.dash-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,5vw,68px);line-height:.9;letter-spacing:.04em;color:var(--text-bright);margin-bottom:36px}
.dash-title em{color:var(--accent);font-style:normal}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:32px;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.stat-cell{background:var(--surface);padding:18px 22px;transition:background .2s}
.stat-cell:hover{background:var(--surface2)}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:1;letter-spacing:.04em;margin-bottom:2px}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.s-total{color:var(--text-bright)} .s-active{color:var(--green)} .s-stalled{color:var(--yellow)} .s-parked{color:var(--muted)} .s-done{color:var(--blue)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.filter-pill{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;cursor:pointer;transition:all .15s}
.filter-pill:hover{color:var(--text);border-color:var(--border2)}
.filter-pill.active{background:var(--accent-dim);border-color:rgba(232,197,71,.3);color:var(--accent)}
.toolbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;border-radius:2px;outline:none;width:220px;transition:border-color .2s}
.search-input:focus{border-color:var(--border2)}
.search-input::placeholder{color:var(--muted)}

/* PROJECT CARDS */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:2px}
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow:hidden;transition:all .2s;cursor:pointer;animation:cardIn .35s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.p-card:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 40px rgba(0,0,0,.5)}
.card-bar{height:2px;width:100%}
.p-card[data-status="active"] .card-bar{background:var(--green)}
.p-card[data-status="stalled"] .card-bar{background:var(--yellow)}
.p-card[data-status="parked"] .card-bar{background:var(--muted)}
.p-card[data-status="completed"] .card-bar{background:var(--blue)}
.card-body{padding:22px 24px 18px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.card-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:16px;color:var(--text-bright);line-height:1.3;flex:1}
.card-badges{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.badge{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
.badge-active{background:var(--green-dim);color:var(--green);border:1px solid rgba(61,214,140,.15)}
.badge-stalled{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(232,197,71,.15)}
.badge-parked{background:rgba(74,79,104,.12);color:var(--muted);border:1px solid rgba(74,79,104,.15)}
.badge-completed{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(91,156,246,.15)}
.badge-high{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,92,92,.15)}
.badge-mid{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(232,197,71,.15)}
.badge-low{background:rgba(74,79,104,.1);color:var(--muted);border:1px solid rgba(74,79,104,.12)}
.card-category{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:10px}
.card-summary{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:16px}
.prog-row{margin-bottom:14px}
.prog-header{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.prog-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent)}
.prog-track{height:2px;background:var(--border2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.p-card[data-status="active"] .prog-fill{background:var(--green)}
.p-card[data-status="stalled"] .prog-fill{background:var(--yellow)}
.p-card[data-status="parked"] .prog-fill{background:var(--muted)}
.p-card[data-status="completed"] .prog-fill{background:var(--blue)}
.next-box{background:var(--bg);border:1px solid var(--border);border-radius:2px;padding:10px 12px;margin-bottom:12px}
.next-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.next-label::before{content:'▶';font-size:6px}
.next-text{font-size:12px;color:var(--text);line-height:1.55}
.blocker-box{background:rgba(255,92,92,.04);border:1px solid rgba(255,92,92,.12);border-radius:2px;padding:10px 12px;margin-bottom:12px}
.blocker-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.blocker-text{font-size:12px;color:rgba(255,92,92,.8);line-height:1.5}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.card-date{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.card-actions{display:flex;gap:6px}
.add-card{background:transparent;border:1px dashed var(--border2);border-radius:2px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .2s;min-height:200px}
.add-card:hover{border-color:var(--accent);background:var(--accent-dim)}
.add-card-icon{font-size:28px}
.add-card-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.add-card:hover .add-card-label{color:var(--accent)}

/* LOADING / ERROR */
.loading-state{text-align:center;padding:40px 0}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.error-bar{background:var(--red-dim);border:1px solid rgba(255,92,92,.15);border-radius:3px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:var(--red);display:flex;gap:10px;align-items:flex-start}

/* DETAIL VIEW */
#detailView{padding:0 48px 100px}
.detail-header{padding:32px 0 28px;border-bottom:1px solid var(--border);margin-bottom:36px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.detail-back{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:12px;transition:color .15s;width:fit-content}
.detail-back:hover{color:var(--accent)}
.detail-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,4vw,56px);line-height:1;letter-spacing:.04em;color:var(--text-bright)}
.detail-meta{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.detail-actions{display:flex;gap:8px;flex-shrink:0}
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:24px}
.section{margin-bottom:28px}
.section-head{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.section-head::after{content:'';flex:1;height:1px;background:var(--border)}
.status-block{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:20px}
.status-block-bar{height:3px}
.status-block[data-status="active"] .status-block-bar{background:var(--green)}
.status-block[data-status="stalled"] .status-block-bar{background:var(--yellow)}
.status-block[data-status="parked"] .status-block-bar{background:var(--muted)}
.status-block[data-status="completed"] .status-block-bar{background:var(--blue)}
.status-block-body{padding:20px 24px}
.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
.status-item-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.status-item-val{font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;color:var(--text-bright)}
.next-action-detail{background:rgba(232,197,71,.04);border:1px solid rgba(232,197,71,.12);border-radius:3px;padding:18px 20px;margin-bottom:20px}
.nad-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.nad-label::before{content:'▶';font-size:7px}
.nad-text{font-size:14px;color:var(--text-bright);line-height:1.6;font-weight:500}
.blocker-detail{background:rgba(255,92,92,.05);border:1px solid rgba(255,92,92,.15);border-radius:3px;padding:16px 20px;margin-bottom:20px}
.bd-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.bd-text{font-size:13px;color:rgba(255,92,92,.85);line-height:1.6}
.history-list{display:flex;flex-direction:column;gap:2px}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow:hidden;transition:border-color .15s}
.history-item:hover{border-color:var(--border2)}
.history-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;gap:12px}
.history-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.history-preview{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-toggle{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);transition:transform .2s}
.history-item.open .history-toggle{transform:rotate(180deg)}
.history-body{display:none;padding:14px 16px 16px;border-top:1px solid var(--border)}
.history-item.open .history-body{display:block}
.history-section{margin-bottom:12px}
.history-section:last-child{margin-bottom:0}
.hs-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hs-content{font-size:12px;color:var(--text);line-height:1.65}
.hs-content ul{padding-left:16px}
.hs-content li{margin-bottom:4px}
.sidebar-panel{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.sidebar-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sidebar-panel-body{padding:14px 16px}
.mini-stat{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini-stat:last-child{margin-bottom:0}
.mini-stat-label{font-size:12px;color:var(--text)}
.mini-stat-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.bug-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.bug-item:last-child{border-bottom:none;padding-bottom:0}
.bug-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.bug-resolved .bug-dot{background:var(--green)}
.bug-pending .bug-dot{background:var(--red)}
.bug-text{color:var(--text);line-height:1.5}
.milestone-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.milestone-item:last-child{border-bottom:none;padding-bottom:0}
.milestone-check{color:var(--green);font-size:11px;flex-shrink:0;margin-top:1px}
.milestone-text{color:var(--text);line-height:1.5}
.milestone-date{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}
.folder-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:2px;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-state{text-align:center;padding:60px 0;color:var(--muted);grid-column:1/-1}
.p-card:nth-child(1){animation-delay:.04s}.p-card:nth-child(2){animation-delay:.08s}.p-card:nth-child(3){animation-delay:.12s}.p-card:nth-child(4){animation-delay:.16s}.p-card:nth-child(5){animation-delay:.20s}.p-card:nth-child(6){animation-delay:.24s}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}#dashboardView,#detailView{padding-left:24px;padding-right:24px}.header,.apikey-bar,.autolock-bar{padding-left:24px;padding-right:24px}.stats-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.projects-grid{grid-template-columns:1fr}.status-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="glow"></div>

<!-- PIN LOCK -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon" id="lockIcon">&#x1F512;</span>
    <div class="lock-title" id="lockTitle">PROJECT COMMAND</div>
    <div class="lock-sub" id="lockSub">ENTER PIN TO UNLOCK</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <div class="pin-key" onclick="PP('1')">1</div>
      <div class="pin-key" onclick="PP('2')">2</div>

      <div class="pin-key" onclick="PP('5')">5</div>
      <div class="pin-key" onclick="PP('6')">6</div>
      <div class="pin-key" onclick="PP('7')">7</div>
      <div class="pin-key" onclick="PP('8')">8</div>
      <div class="pin-key" onclick="PP('9')">9</div>

<!-- DASHBOARD VIEW -->
<div class="view active" id="dashboardView">
  <div id="dashInner" style="padding:40px 48px 100px">
    <div class="dash-eyebrow">vviz.studio</div>

      <button class="filter-pill active" data-f="all">All</button>

        <input class="search-input" type="text" id="srch" placeholder="Search projects...">

<!-- DETAIL VIEW -->
<div class="view" id="detailView">
  <div style="padding:0 48px 100px">
    <div class="detail-header">
      <div>
        <div class="detail-back" onclick="showView('dashboard')">&#x2190; Back to Dashboard</div>
        <div class="detail-name" id="dName">Project</div>
        <div class="detail-meta" id="dMeta"></div>

        <button class="btn btn-outline" id="dRefresh">&#x21BB; Refresh</button>
        <button class="btn btn-danger btn-sm" id="dRemove">Remove Project</button>

      <div id="dMain"></div>

<script>
var KA='pc_ak', KP='pc_projects', KPN='pc_pin';
var MODEL='claude-sonnet-4-20250514';
var AL_SECS=30*60;

// OBFUSCATE
function ob(s){var k='vviz2026';return btoa(s.split('').map(function(c,i){return String.fromCharCode(c.charCodeAt(0)^k.charCodeAt(i%k.length))}).join(''))}
function dob(s){try{var k='vviz2026';return atob(s).split('').map(function(c,i){return String.fromCharCode(c.charCodeAt(0)^k.charCodeAt(i%k.length))}).join('')}catch(e){return''}}

// HASH PIN
function hpin(p){var s='pc26_'+p,h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h.toString(36)}

// STATE
var pin={entered:'',mode:'unlock',tmp:'',locked:true,tries:0};
var alTimer=null,alSecs=AL_SECS;
var app={projects:[],filter:'all',search:'',activeId:null};

// INIT
document.addEventListener('DOMContentLoaded',function(){
  tick(); setInterval(tick,1000);
  var hp=localStorage.getItem(KPN);
  if(!hp){
    pin.mode='setup';
    document.getElementById('lockIcon').textContent='\uD83D\uDD10';
    document.getElementById('lockTitle').textContent='SET YOUR PIN';
    document.getElementById('lockSub').textContent='CHOOSE A 4-DIGIT PIN';
    document.getElementById('lockNote').textContent='You will confirm it on the next step.';
  }
  document.querySelectorAll('.filter-pill').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.filter-pill').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');
      app.filter=b.dataset.f;
      renderCards();
    });
  });
  document.getElementById('srch').addEventListener('input',function(e){
    app.search=e.target.value.toLowerCase();
    renderCards();
    resetAL();
  });
  document.addEventListener('keydown',function(e){
    if(pin.locked){
      if(e.key>='0'&&e.key<='9') PP(e.key);
      if(e.key==='Backspace') PD();
      if(e.key==='Escape') PC();
    }
  });
  ['click','keydown','mousemove','touchstart'].forEach(function(ev){
    document.addEventListener(ev,resetAL,{passive:true});
  });
});

function tick(){
  var n=new Date();
  var d=n.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});
  var t=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clock').textContent=d+' · '+t;
}

// PIN
function PP(d){
  if(pin.entered.length>=4) return;
  pin.entered+=d;
  dots();
  if(pin.entered.length===4) setTimeout(handlePin,150);
}
function PD(){pin.entered=pin.entered.slice(0,-1);dots()}
function PC(){pin.entered='';dots();document.getElementById('lockErr').textContent=''}
function dots(){
  for(var i=0;i<4;i++){
    var el=document.getElementById('d'+i);
    el.classList.toggle('filled',i<pin.entered.length);
    el.classList.remove('error');
  }
}
function dotErr(){
  for(var i=0;i<4;i++){var el=document.getElementById('d'+i);el.classList.remove('filled');el.classList.add('error')}
  setTimeout(function(){for(var i=0;i<4;i++)document.getElementById('d'+i).classList.remove('error');pin.entered='';dots()},500);
}

function handlePin(){
  var e=pin.entered;
  if(pin.mode==='setup'){
    pin.tmp=e; pin.mode='confirm'; pin.entered=''; dots();
    document.getElementById('lockSub').textContent='CONFIRM YOUR PIN';
    document.getElementById('lockErr').textContent='';
    return;
  }
  if(pin.mode==='confirm'){
    if(e===pin.tmp){
      localStorage.setItem(KPN,hpin(e));
      pin.mode='unlock';
      unlock();
    } else {
      document.getElementById('lockErr').textContent='PINs do not match. Try again.';
      dotErr();
      pin.mode='setup'; pin.tmp='';
      document.getElementById('lockSub').textContent='CHOOSE A 4-DIGIT PIN';
    }
    return;
  }
  if(pin.mode==='unlock'){
    var stored=localStorage.getItem(KPN);
    if(hpin(e)===stored){
      pin.tries=0; unlock();
    } else {
      pin.tries++;
      dotErr();
      var left=5-pin.tries;
      if(left<=0){
        document.getElementById('lockErr').textContent='Too many attempts. Clearing data...';
        setTimeout(function(){localStorage.clear();location.reload()},1500);
      } else {
        document.getElementById('lockErr').textContent='Wrong PIN. '+left+' attempt'+(left===1?'':'s')+' remaining.';
      }
    }
  }
}

function unlock(){
  pin.locked=false;
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('alBar').classList.remove('hidden');
  var k=localStorage.getItem(KA);
  if(k) document.getElementById('apiIn').value=dob(k);
  var saved=localStorage.getItem(KP);
  if(saved){try{app.projects=JSON.parse(saved).map(function(p){p.dirHandle=null;p.analyzing=false;return p})}catch(e){app.projects=[]}}
  renderDash();
  startAL();
}

function lockNow(){
  pin.locked=true; pin.entered=''; pin.mode='unlock'; dots();
  document.getElementById('lockErr').textContent='';
  document.getElementById('lockIcon').textContent='\uD83D\uDD12';
  document.getElementById('lockTitle').textContent='PROJECT COMMAND';
  document.getElementById('lockSub').textContent='ENTER PIN TO UNLOCK';
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('alBar').classList.add('hidden');
  document.getElementById('apiIn').value='';
  clearInterval(alTimer); alSecs=AL_SECS;
}

function startAL(){
  clearInterval(alTimer); alSecs=AL_SECS;
  alTimer=setInterval(function(){
    alSecs--;
    var m=Math.floor(alSecs/60).toString().padStart(2,'0');
    var s=(alSecs%60).toString().padStart(2,'0');
    var el=document.getElementById('alTimer');
    if(el) el.textContent=m+':'+s;
    if(alSecs<=0) lockNow();
  },1000);
}
function resetAL(){if(!pin.locked) alSecs=AL_SECS}

// VIEWS
function showView(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active')});
  document.getElementById(v+'View').classList.add('active');
  window.scrollTo(0,0); resetAL();
}

// API KEY
function getKey(){return document.getElementById('apiIn').value.trim()}
function saveKey(){
  var k=getKey();
  if(!k.startsWith('sk-')){alert('Paste a valid Anthropic API key (starts with sk-ant-...)');return}
  localStorage.setItem(KA,ob(k));
  var el=document.getElementById('keySaved');
  el.classList.remove('hidden');
  setTimeout(function(){el.classList.add('hidden')},2000);
  resetAL();
}
function toggleKey(){var i=document.getElementById('apiIn');i.type=i.type==='password'?'text':'password'}

// PERSIST
function persist(){
  localStorage.setItem(KP,JSON.stringify(app.projects.map(function(p){
    return {id:p.id,name:p.name,folderName:p.folderName,status:p.status,priority:p.priority,progress:p.progress,summary:p.summary,nextAction:p.nextAction,blocker:p.blocker,category:p.category,lastSession:p.lastSession,sessions:p.sessions,bugs:p.bugs,milestones:p.milestones,analyzing:false,dirHandle:null}
  })));
}

// ADD PROJECT
async function addProject(){
  var k=getKey();
  if(!k||!k.startsWith('sk-')){alert('Save a valid API key first.');return}
  if(!('showDirectoryPicker' in window)){showErr('Use Chrome or Edge — folder picker not supported here.');return}
  var dh;
  try{dh=await window.showDirectoryPicker({mode:'read'})}
  catch(e){if(e.name!=='AbortError')showErr('Could not open folder: '+e.message);return}
  if(app.projects.find(function(p){return p.folderName===dh.name})){
    alert('"'+dh.name+'" is already in the dashboard.');return;
  }
  var id='p'+Date.now();
  app.projects.push({id:id,name:dh.name,folderName:dh.name,status:'active',priority:'mid',progress:0,summary:'Loading...',nextAction:'',blocker:null,category:'Other',lastSession:'',sessions:[],bugs:[],milestones:[],dirHandle:dh,analyzing:true});
  renderDash();
  await analyzeProject(id,dh);
  resetAL();
}

async function analyzeProject(id,dh){
  var p=app.projects.find(function(x){return x.id===id});
  if(!p) return;
  p.analyzing=true; p.dirHandle=dh; renderCards();
  try{
    var files=await readFiles(dh);
    if(!files.length){p.summary='No session-wrapup-*.md files found.';p.analyzing=false;persist();renderCards();return}
    var res=await callClaude(files,p.folderName);
    Object.assign(p,res,{analyzing:false});
    persist(); renderDash();
  }catch(e){p.summary='Analysis failed: '+e.message;p.analyzing=false;persist();renderCards()}
}

async function readFiles(dh){
  var files=[];
  await collectF(dh,files,0);
  files.sort(function(a,b){return b.name.localeCompare(a.name)});
  return files;
}
async function collectF(dir,files,depth){
  for await(var entry of dir.entries()){
    var name=entry[0],handle=entry[1];
    if(handle.kind==='file'&&name.startsWith('session-wrapup-')&&name.endsWith('.md')){
      var f=await handle.getFile();
      var c=await f.text();
      files.push({name:name,content:c.slice(0,3000)});
    } else if(handle.kind==='directory'&&depth<2){
      await collectF(handle,files,depth+1);
    }
  }
}

async function callClaude(files,hint){
  var k=getKey();
  var block=files.map(function(f,i){return '=== FILE '+(i+1)+': '+f.name+' ===\n'+f.content}).join('\n\n');
  var prompt='You are analyzing session wrapup markdown files for project "'+hint+'". Return ONLY valid JSON (no markdown fences, no explanation).\n\nJSON structure:\n{\n"name":"project name",\n"category":"Dev / App | 3D Visualization | Content / YouTube | Business / Finance | Health / Fitness | Personal | Other",\n"status":"active|stalled|parked|completed",\n"priority":"high|mid|low",\n"progress":0,\n"summary":"2-3 sentence summary",\n"nextAction":"single specific next task",\n"blocker":"what is blocking or null",\n"lastSession":"YYYY-MM-DD",\n"sessions":[{"date":"YYYY-MM-DD","whatWasDone":["item1"],"nextAction":"","notes":""}],\n"bugs":[{"text":"bug","resolved":true}],\n"milestones":[{"text":"milestone","date":"YYYY-MM-DD"}]\n}\n\nSessions: all sessions newest first. Bugs: extract all bugs, mark resolved if fixed later. Milestones: completed features.\n\nFILES:\n'+block;
  var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:4096,messages:[{role:'user',content:prompt}]})});
  if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error('API '+r.status+': '+(e.error&&e.error.message||r.statusText))}
  var d=await r.json();
  var raw=(d.content&&d.content[0]&&d.content[0].text)||'';
  var clean=raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
  try{return JSON.parse(clean)}catch(e){throw new Error('Invalid JSON from Claude. Check wrapup file format.')}
}

async function refreshProject(id){
  var p=app.projects.find(function(x){return x.id===id});
  if(!p) return;
  if(!p.dirHandle){
    if(!('showDirectoryPicker' in window)){showErr('Use Chrome or Edge.');return}
    try{p.dirHandle=await window.showDirectoryPicker({mode:'read'})}catch(e){return}
  }
  await analyzeProject(id,p.dirHandle);
  resetAL();
}

function removeProject(id){
  if(!confirm('Remove this project? Your files are not deleted.')) return;
  app.projects=app.projects.filter(function(p){return p.id!==id});
  persist(); showView('dashboard'); renderDash();
}

// RENDER
function renderDash(){updateStats();renderCards()}

function updateStats(){
  var ps=app.projects;
  document.getElementById('cTotal').textContent=ps.length;
  document.getElementById('cActive').textContent=ps.filter(function(p){return p.status==='active'}).length;
  document.getElementById('cStalled').textContent=ps.filter(function(p){return p.status==='stalled'}).length;
  document.getElementById('cParked').textContent=ps.filter(function(p){return p.status==='parked'}).length;
  document.getElementById('cDone').textContent=ps.filter(function(p){return p.status==='completed'}).length;
}

function renderCards(){
  var grid=document.getElementById('grid');
  grid.innerHTML='';
  var ord={active:0,stalled:1,parked:2,completed:3},por={high:0,mid:1,low:2};
  var list=app.projects.filter(function(p){
    var mf=app.filter==='all'||p.status===app.filter;
    var ms=!app.search||((p.name||'').toLowerCase().indexOf(app.search)>-1)||((p.summary||'').toLowerCase().indexOf(app.search)>-1);
    return mf&&ms;
  }).sort(function(a,b){
    var so=(ord[a.status]||4)-(ord[b.status]||4);
    return so!==0?so:(por[a.priority]||3)-(por[b.priority]||3);
  });

  list.forEach(function(p,i){
    var card=document.createElement('div');
    card.className='p-card';
    card.dataset.status=p.status||'parked';
    card.style.animationDelay=(i*0.05)+'s';
    card.onclick=function(){openDetail(p.id)};
    var pct=Math.min(100,Math.max(0,parseInt(p.progress)||0));
    var hb=p.blocker&&p.blocker!=='null'&&p.blocker!==null;
    if(p.analyzing){
      card.innerHTML='<div class="card-bar"></div><div class="card-body"><div class="card-top"><div class="card-name">'+esc(p.folderName)+'</div></div><div class="loading-state"><div class="spinner"></div><div class="loading-text">Analyzing with Claude...</div></div></div>';
      grid.appendChild(card); return;
    }
    var html='<div class="card-bar"></div><div class="card-body">';
    html+='<div class="card-top"><div class="card-name">'+esc(p.name||p.folderName)+'</div>';
    html+='<div class="card-badges"><span class="badge badge-'+(p.status||'parked')+'">'+(p.status||'--')+'</span><span class="badge badge-'+(p.priority||'low')+'">'+(p.priority||'--')+'</span></div></div>';
    html+='<div class="card-category">&#x1F4C1; '+esc(p.category||'Other')+'</div>';
    html+='<div class="card-summary">'+esc(p.summary||'No summary.')+'</div>';
    html+='<div class="prog-row"><div class="prog-header"><span class="prog-label">Progress</span><span class="prog-pct">'+pct+'%</span></div><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div></div>';
    if(p.nextAction) html+='<div class="next-box"><div class="next-label">Next Action</div><div class="next-text">'+esc(p.nextAction)+'</div></div>';
    if(hb) html+='<div class="blocker-box"><div class="blocker-label">&#x26A0; Blocker</div><div class="blocker-text">'+esc(p.blocker)+'</div></div>';
    html+='</div><div class="card-foot"><div class="card-date">Last session: '+esc(p.lastSession||'--')+'</div>';
    html+='<div class="card-actions" onclick="event.stopPropagation()"><button class="btn btn-outline btn-sm" onclick="refreshProject(\''+p.id+'\')">&#x21BB; Refresh</button></div></div>';
    card.innerHTML=html;
    grid.appendChild(card);
  });

  var add=document.createElement('div');
  add.className='add-card';
  add.onclick=addProject;
  add.innerHTML='<div class="add-card-icon">&#x1F4C1;</div><div class="add-card-label">Add Project Folder</div>';
  grid.appendChild(add);
}

function openDetail(id){
  var p=app.projects.find(function(x){return x.id===id});
  if(!p) return;
  app.activeId=id;
  document.getElementById('dName').textContent=p.name||p.folderName;
  var meta=document.getElementById('dMeta');
  meta.innerHTML='<span class="badge badge-'+(p.status||'parked')+'">'+(p.status||'--')+'</span> <span class="badge badge-'+(p.priority||'low')+'">'+(p.priority||'--')+'</span> <span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--muted)">'+esc(p.category||'Other')+'</span> <span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--muted)">Last: '+esc(p.lastSession||'--')+'</span>';
  document.getElementById('dRefresh').onclick=function(){refreshProject(id)};
  document.getElementById('dRemove').onclick=function(){removeProject(id)};
  renderMain(p); renderSide(p);
  showView('detail'); resetAL();
}

function renderMain(p){
  var pct=Math.min(100,Math.max(0,parseInt(p.progress)||0));
  var hb=p.blocker&&p.blocker!=='null'&&p.blocker!==null;
  var html='<div class="status-block" data-status="'+(p.status||'parked')+'">';
  html+='<div class="status-block-bar"></div><div class="status-block-body">';
  html+='<div class="status-row">';
  html+='<div><div class="status-item-label">Status</div><div class="status-item-val">'+cap(p.status||'--')+'</div></div>';
  html+='<div><div class="status-item-label">Priority</div><div class="status-item-val">'+cap(p.priority||'--')+'</div></div>';
  html+='<div><div class="status-item-label">Progress</div><div class="status-item-val">'+pct+'%</div></div>';
  html+='</div>';
  html+='<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>';
  html+='<div style="margin-top:10px;font-size:12px;color:var(--text);line-height:1.65">'+esc(p.summary||'')+'</div>';
  html+='</div></div>';
  if(p.nextAction) html+='<div class="next-action-detail"><div class="nad-label">Next Action</div><div class="nad-text">'+esc(p.nextAction)+'</div></div>';
  if(hb) html+='<div class="blocker-detail"><div class="bd-label">&#x26A0; Blocker</div><div class="bd-text">'+esc(p.blocker)+'</div></div>';
  html+='<div class="section"><div class="section-head">Session History ('+(p.sessions||[]).length+' sessions)</div><div id="hlist"></div></div>';
  document.getElementById('dMain').innerHTML=html;
  var list=document.getElementById('hlist');
  var sess=p.sessions||[];
  if(!sess.length){list.innerHTML='<div style="font-size:12px;color:var(--muted);padding:16px 0">No session history found.</div>';return}
  sess.forEach(function(s,i){
    var item=document.createElement('div');
    item.className='history-item'+(i===0?' open':'');
    var prev=Array.isArray(s.whatWasDone)?s.whatWasDone[0]:(s.whatWasDone||'');
    var bhtml='<div class="history-header" onclick="tH(this)"><div class="history-date">'+esc(s.date||'--')+'</div><div class="history-preview">'+esc(prev||'--')+'</div><div class="history-toggle">&#x25BE;</div></div><div class="history-body">';
    if(s.whatWasDone&&s.whatWasDone.length){
      var items=Array.isArray(s.whatWasDone)?s.whatWasDone:[s.whatWasDone];
      bhtml+='<div class="history-section"><div class="hs-label">What Was Done</div><div class="hs-content"><ul>'+items.map(function(b){return '<li>'+esc(b)+'</li>'}).join('')+'</ul></div></div>';
    }
    if(s.nextAction) bhtml+='<div class="history-section"><div class="hs-label">Next Action (then)</div><div class="hs-content">'+esc(s.nextAction)+'</div></div>';
    if(s.notes) bhtml+='<div class="history-section"><div class="hs-label">Notes</div><div class="hs-content">'+esc(s.notes)+'</div></div>';
    bhtml+='</div>';
    item.innerHTML=bhtml;
    list.appendChild(item);
  });
}

function renderSide(p){
  var bugs=p.bugs||[], ms=p.milestones||[];
  var res=bugs.filter(function(b){return b.resolved}), pend=bugs.filter(function(b){return !b.resolved});
  var html='<div class="sidebar-panel"><div class="sidebar-panel-head">Folder</div><div class="sidebar-panel-body"><div class="folder-tag">&#x1F4C1; '+esc(p.folderName||'--')+'</div><div style="font-size:11px;color:var(--muted)">Last analyzed: '+esc(p.lastSession||'--')+'</div></div></div>';
  html+='<div class="sidebar-panel"><div class="sidebar-panel-head">Overview</div><div class="sidebar-panel-body">';
  html+='<div class="mini-stat"><span class="mini-stat-label">Sessions logged</span><span class="mini-stat-val">'+(p.sessions||[]).length+'</span></div>';
  html+='<div class="mini-stat"><span class="mini-stat-label">Bugs resolved</span><span class="mini-stat-val" style="color:var(--green)">'+res.length+'</span></div>';
  html+='<div class="mini-stat"><span class="mini-stat-label">Bugs pending</span><span class="mini-stat-val" style="color:var(--red)">'+pend.length+'</span></div>';
  html+='<div class="mini-stat"><span class="mini-stat-label">Milestones</span><span class="mini-stat-val" style="color:var(--blue)">'+ms.length+'</span></div>';
  html+='</div></div>';
  if(pend.length) html+='<div class="sidebar-panel"><div class="sidebar-panel-head">Pending Bugs ('+pend.length+')</div><div class="sidebar-panel-body">'+pend.map(function(b){return '<div class="bug-item bug-pending"><div class="bug-dot"></div><div class="bug-text">'+esc(b.text)+'</div></div>'}).join('')+'</div></div>';
  if(res.length) html+='<div class="sidebar-panel"><div class="sidebar-panel-head">Resolved Bugs ('+res.length+')</div><div class="sidebar-panel-body">'+res.map(function(b){return '<div class="bug-item bug-resolved"><div class="bug-dot"></div><div class="bug-text">'+esc(b.text)+'</div></div>'}).join('')+'</div></div>';
  if(ms.length) html+='<div class="sidebar-panel"><div class="sidebar-panel-head">Build Milestones</div><div class="sidebar-panel-body">'+ms.map(function(m){return '<div class="milestone-item"><div class="milestone-check">&#x2713;</div><div><div class="milestone-text">'+esc(m.text)+'</div>'+(m.date?'<div class="milestone-date">'+esc(m.date)+'</div>':'')+'</div></div>'}).join('')+'</div></div>';
  document.getElementById('dSide').innerHTML=html;
}

function tH(h){h.parentElement.classList.toggle('open')}

function showErr(msg){
  document.getElementById('errTxt').textContent=msg;
  document.getElementById('errBar').classList.remove('hidden');
  setTimeout(function(){document.getElementById('errBar').classList.add('hidden')},6000);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
</script>
